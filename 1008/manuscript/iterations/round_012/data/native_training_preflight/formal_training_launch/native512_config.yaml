model:
  base_learning_rate: 0.0001
  target: mvpainter.model_unet_geotex.MVDiffusionGeoTex
  params:
    drop_cond_prob: 0.1
    stable_diffusion_config:
      pretrained_model_name_or_path: ../checkpoints/hf_repo
    adapter_mode: up_only
    geo_channels: 64
    foreground_loss_weight: 0.3
    ssim_loss_weight: 0.5
    edge_loss_weight: 0.1
    adapter_reg_weight: 0.0001
    img_size: 512
data:
  target: src.data.mvpainter_dataset.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 0
    train:
      target: src.data.mvpainter_dataset.MVPainterData
      params:
        root_dir_list:
        - /4T/CXY/MV-Painter/data/train_data/rendered_full
        meta_fname: train_meta.json
        object_list_file: /4T/CXY/MV-Painter-1010/1010/experiments/revision_expansion_20261010/iteration008_native_training_attempt02/train_objects_native_valid.txt
        target_view_mode: unique6
    validation:
      target: src.data.mvpainter_dataset.MVPainterData
      params:
        root_dir_list:
        - /4T/CXY/MV-Painter/data/train_data/rendered_full
        meta_fname: test_meta.json
        object_list_file: /4T/CXY/MV-Painter/final/round2/clean_dataset_v2/strict_holdout_objects_276_clean_v2.txt
        target_view_mode: unique6
lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 500
      save_top_k: -1
      save_last: true
  callbacks:
    geotex_checkpoint:
      target: mvpainter.model_unet_geotex.GeoTexCheckpointCallback
      params:
        every_n_steps: 500
  trainer:
    benchmark: true
    max_epochs: -1
    max_steps: 2000
    gradient_clip_val: 1.0
    val_check_interval: 1000000
    num_sanity_val_steps: 0
    accumulate_grad_batches: 1
    check_val_every_n_epoch: null
