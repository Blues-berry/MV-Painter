## GeoTex-Adapter + Full Adaptive Correction (FAC) Training Config
##
## FAC consists of three modules (each can be independently enabled):
##   - LTAG: Learned Timestep-Adaptive Gating (replaces TCAS)
##   - GSG: Geometry-Conditioned Spatial Gating
##   - FSC: Frequency-Selective Correction
##
## Training strategy: load pre-trained GeoTex adapter checkpoint, then
## fine-tune with FAC modules enabled. FAC adds ~6K params (negligible).

model:
  base_learning_rate: 5.0e-05  # Lower LR for fine-tuning with FAC
  target: mvpainter.model_unet_geotex.MVDiffusionGeoTex
  params:
    drop_cond_prob: 0.1
    stable_diffusion_config:
      pretrained_model_name_or_path: ../checkpoints/hf_repo
    adapter_mode: up_only
    geo_channels: 64
    foreground_loss_weight: 0.3
    ssim_loss_weight: 0.5
    edge_loss_weight: 0.1
    adapter_reg_weight: 1e-4
    img_size: 256
    # FAC modules
    enable_ltag: true
    enable_gsg: true
    enable_fsc: true
    ltag_init_schedule:
      early: 1.25
      mid: 2.50
      late: 1.25

data:
  target: src.data.mvpainter_dataset.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 0
    train:
      target: src.data.mvpainter_dataset.MVPainterData
      params:
        root_dir_list: ['/4T/CXY/MV-Painter/data/train_data/rendered_full']
        meta_fname: train_meta.json
        object_list_file: train_objects_1200.txt
    validation:
      target: src.data.mvpainter_dataset.MVPainterData
      params:
        root_dir_list: ['/4T/CXY/MV-Painter/data/train_data/rendered_full']
        meta_fname: test_meta.json
        object_list_file: test_objects_300.txt

lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 200
      save_top_k: -1
      save_last: true
  callbacks:
    geotex_checkpoint:
      target: mvpainter.model_unet_geotex.GeoTexCheckpointCallback
      params:
        every_n_steps: 200

  trainer:
    benchmark: true
    max_epochs: -1
    max_steps: 500  # FAC converges fast (~6K params)
    gradient_clip_val: 1.0
    val_check_interval: 1000000
    num_sanity_val_steps: 0
    accumulate_grad_batches: 1
    check_val_every_n_epoch: null
