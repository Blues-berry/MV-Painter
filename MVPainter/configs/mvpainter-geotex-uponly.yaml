model:
  base_learning_rate: 1.0e-04
  target: mvpainter.model_unet_geotex.MVDiffusionGeoTex
  params:
    drop_cond_prob: 0.1
    stable_diffusion_config:
      pretrained_model_name_or_path: ../checkpoints/hf_repo
    adapter_mode: up_only
    geo_channels: 64
    foreground_loss_weight: 0.3
    ssim_loss_weight: 0.05
    edge_loss_weight: 0.02
    adapter_reg_weight: 1e-4
    img_size: 256

data:
  target: src.data.mvpainter_dataset.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 0
    train:
      target: src.data.mvpainter_dataset.MVPainterData
      params:
        root_dir_list: ['/4T/CXY/MV-Painter/data/train_data/rendered_full']
        meta_fname: train_meta.json
        object_list_file: train_objects_1200.txt
    validation:
      target: src.data.mvpainter_dataset.MVPainterData
      params:
        root_dir_list: ['/4T/CXY/MV-Painter/data/train_data/rendered_full']
        meta_fname: test_meta.json
        object_list_file: test_objects_300.txt

lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 100
      save_top_k: -1
      save_last: true
  callbacks:
    geotex_checkpoint:
      target: mvpainter.model_unet_geotex.GeoTexCheckpointCallback
      params:
        every_n_steps: 100

  trainer:
    benchmark: true
    max_epochs: -1
    max_steps: 500
    gradient_clip_val: 1.0
    val_check_interval: 1000000
    num_sanity_val_steps: 0
    accumulate_grad_batches: 1
    check_val_every_n_epoch: null
