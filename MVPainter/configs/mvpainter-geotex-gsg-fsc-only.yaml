## GeoTex-Adapter + GSG + FSC (no LTAG) Training Config
##
## Uses TCAS hand-crafted schedule for temporal scaling,
## only trains spatial gating (GSG) and frequency filtering (FSC).
## This avoids the "scale collapse" problem where LTAG learns to
## reduce adapter correction to minimize noise MSE loss.

model:
  base_learning_rate: 5.0e-04
  target: mvpainter.model_unet_geotex.MVDiffusionGeoTex
  params:
    drop_cond_prob: 0.1
    stable_diffusion_config:
      pretrained_model_name_or_path: ../checkpoints/hf_repo
    adapter_mode: up_only
    geo_channels: 64
    foreground_loss_weight: 0.3
    ssim_loss_weight: 0.5
    edge_loss_weight: 0.1
    adapter_reg_weight: 1e-4
    img_size: 256
    # Only GSG + FSC, no LTAG
    enable_ltag: false
    enable_gsg: true
    enable_fsc: true

data:
  target: src.data.mvpainter_dataset.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 0
    train:
      target: src.data.mvpainter_dataset.MVPainterData
      params:
        root_dir_list: ['/4T/CXY/MV-Painter/data/train_data/rendered_full']
        meta_fname: train_meta.json
        object_list_file: train_objects_1200.txt
    validation:
      target: src.data.mvpainter_dataset.MVPainterData
      params:
        root_dir_list: ['/4T/CXY/MV-Painter/data/train_data/rendered_full']
        meta_fname: test_meta.json
        object_list_file: test_objects_300.txt

lightning:
  trainer:
    benchmark: true
    max_epochs: -1
    max_steps: 1000
    gradient_clip_val: 1.0
