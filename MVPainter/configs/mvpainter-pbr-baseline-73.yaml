pretrained_model_name_or_path: lizb6626/IDArb
pretrained_unet_path: lizb6626/IDArb

output_dir: 'output/pbr-baseline-73'

revision: null

dataset_root:
  mvpainter: '/4T/CXY/MV-Painter/data/train_data/rendered_full'
train_dataset:
  object_list: '/4T/CXY/MV-Painter/MVPainter/datalist/mvpainter_pbr_train_73.json'
  img_wh: [256, 256]
  split: 'train'
  num_views: 2
validation_train_dataset:
  object_list: '/4T/CXY/MV-Painter/MVPainter/datalist/mvpainter_pbr_train_73.json'
  img_wh: [256, 256]
  split: 'train'
  num_samples: 16
  num_views: 2
validation_dataset:
  object_list: '/4T/CXY/MV-Painter/MVPainter/datalist/mvpainter_pbr_train_73.json'
  img_wh: [256, 256]
  split: 'test'
  num_views: 2
  num_samples: 8

seed: 42
train_batch_size: 1
validation_batch_size: 1
validation_train_batch_size: 1
max_train_steps: 10000
gradient_accumulation_steps: 2
gradient_checkpointing: true
learning_rate: 5.e-6
scale_lr: false
lr_scheduler: "constant_with_warmup"
lr_warmup_steps: 100
snr_gamma: 5.0
use_8bit_adam: false
allow_tf32: true
use_ema: true
dataloader_num_workers: 0
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.e-2
adam_epsilon: 1.e-08
max_grad_norm: 1.0
vis_dir: vis
logging_dir: logs
mixed_precision: "fp16"
report_to: 'tensorboard'
local_rank: -1
checkpointing_steps: 500
checkpoints_total_limit: 2

resume_from_checkpoint: null
enable_xformers_memory_efficient_attention: false
validation_steps: 100000
validation_sanity_check: false
tracker_project_name: 'pbr-mvpainter'

trainable_modules: null
use_classifier_free_guidance: true
condition_drop_rate: 0.05
scale_input_latents: true

pipe_kwargs:
  camera_embedding_type: '4DoF'

pipe_validation_kwargs:
  eta: 1.0

unet_from_pretrained_kwargs:
  camera_embedding_type: '4DoF'
  zero_init_conv_in: true
  zero_init_camera_projection: false
  attn1_cd: true
  attn_mid_cv: true

zero_snr: true
linear_noise_schedule: true
single_view_prob: 0.6
wo_camera: false
mv_consistency_weight: 0.0  # Weight for multi-view consistency loss

camera_embedding_type: '4DoF'

metrics:
  albedo: ['ssim', 'psnr']
  material: ['mse']
  normal: ['cosine_similarity']
